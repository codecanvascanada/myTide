<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Easy Tides - Pro Dashboard</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html { scroll-behavior: smooth; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; color: #333; overflow-x: hidden; }

        /* --- [NEW] 상단 헤더 (Portal Style) --- */
        .top-header {
            background: white;
            padding: 15px 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 4000;
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap; /* 모바일 대응 */
        }

        /* 1. 사이트 제목 */
        .site-logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: #0077be;
            letter-spacing: -0.5px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* 2. 포털형 검색창 컨테이너 */
        .header-search-wrapper {
            flex-grow: 1;
            max-width: 600px;
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            border: 2px solid #0077be; /* 브랜드 컬러 테두리 */
            border-radius: 30px; /* 둥근 모서리 */
            overflow: hidden;
            background: #fff;
            transition: box-shadow 0.2s;
        }
        .search-box:focus-within {
            box-shadow: 0 4px 12px rgba(0, 119, 190, 0.2);
        }

        .search-input {
            flex-grow: 1;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            outline: none;
        }

        .search-btn {
            background: #0077be;
            border: none;
            color: white;
            padding: 12px 25px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .search-btn:hover { background: #005c91; }

        /* 자동완성 리스트 */
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 10px; right: 10px;
            background: white;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 12px 12px;
            display: none;
            z-index: 5000;
            list-style: none;
            padding: 0; margin: 5px 0 0 0;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .suggestion-item { padding: 12px 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 0.95rem; }
        .suggestion-item:hover { background: #f0f8ff; color: #0077be; }

        /* 3. 모바일 메뉴 버튼 */
        .hamburger-btn {
            display: none; /* PC 숨김 */
            font-size: 1.8rem;
            background: none;
            border: none;
            color: #333;
            cursor: pointer;
            margin-left: auto; /* 오른쪽 끝으로 */
        }

        /* --- 레이아웃 --- */
        .app-wrapper {
            display: grid;
            grid-template-columns: 1fr 240px; /* 콘텐츠 | 사이드바 */
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar { position: sticky; top: 100px; height: fit-content; background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .content-area { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
        .card { background: white; width: 100%; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); box-sizing: border-box; position: relative; scroll-margin-top: 100px; }
        
        .section-title { font-size: 1.1rem; font-weight: 800; color: #333; margin-bottom: 15px; border-left: 5px solid #0077be; padding-left: 10px; }

        /* 네비게이션 스타일 */
        .nav-menu { display: flex; flex-direction: column; gap: 8px; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 12px; color: #555; text-decoration: none; border-radius: 8px; font-weight: 600; transition: 0.2s; }
        .nav-link:hover { background-color: #e3f2fd; color: #0077be; }
        .close-btn { display: none; text-align: right; font-size: 1.5rem; cursor: pointer; margin-bottom: 10px; }

        /* 기타 UI 요소 */
        .date-controls { display: flex; justify-content: space-between; background: #f8f9fa; padding: 8px; border-radius: 10px; margin-bottom: 15px; }
        .nav-btn { background: white; border: 1px solid #ddd; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
        .date-display { flex-grow: 1; text-align: center; line-height: 40px; font-weight: bold; }
        .info-box { background: #e3f2fd; color: #0d47a1; padding: 10px; text-align: center; border-radius: 8px; margin-bottom: 15px; font-weight: bold; font-size: 0.95rem; }
        
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; border-radius: 16px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #0077be; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        canvas { width: 100% !important; height: 350px !important; }

        /* 지도 & 탭 */
        .map-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .map-tabs button { padding: 6px 12px; border: 1px solid #ddd; background: #f8f9fa; cursor: pointer; border-radius: 6px; font-weight: 600; color: #666; }
        .map-tabs button.active { background: #0077be; color: white; border-color: #0077be; }
        .map-view { display: none; height: 400px; width: 100%; border-radius: 12px; overflow: hidden; }
        .map-view.active { display: block; }
        #map, #windyFrame { width: 100%; height: 100%; border: none; }
        .map-popup-btn { background: #0077be; color: white; border: none; padding: 5px 10px; border-radius: 4px; margin-top: 5px; cursor: pointer; }

        /* 날씨 & 예보 */
        .weather-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card { background: #f8f9fa; padding: 15px; border-radius: 12px; text-align: center; }
        .stat-val { font-size: 1.1rem; font-weight: bold; margin: 5px 0; }
        .scroll-container { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
